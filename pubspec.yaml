name: tlaxgomobil
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  supabase_flutter: ^2.18.3
  http: ^1.2.2
  share_plus: ^10.1.4
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6


  # Geolocalización y Mapas
  flutter_map: ^7.0.0
